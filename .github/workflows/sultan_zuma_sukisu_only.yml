name: Sultan Zuma SukiSU only

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "README.md"

jobs:
  sukisu-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential \
            libssl-dev libelf-dev libncurses5-dev \
            ccache lz4 zip git wget
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Download and extract GCC 14.2.0 toolchain
        run: |
          wget https://www.kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz -O gcc.tar.gz
          gunzip gcc.tar.gz
          tar -xf gcc.tar

      - name: Clone dependencies and set environment
        run: |
          CODENAME="zuma"
          ANDROID_VERSION="android14"
          KERNEL_VERSION="6.1"
          DEFCONFIG="zuma_defconfig"

          git clone --depth=1 https://github.com/TheWildJames/AnyKernel3.git -b "sultan-${CODENAME}" AK3
          echo "ak3_dir=$PWD/AK3" >> $GITHUB_ENV

          git clone --depth=5 https://gitlab.com/simonpunk/susfs4ksu.git -b "gki-${ANDROID_VERSION}-${KERNEL_VERSION}" susfs
          echo "susfs_dir=$PWD/susfs" >> $GITHUB_ENV

          git clone --depth=1 https://github.com/TheWildJames/kernel_patches.git james_patches
          echo "james_dir=$PWD/james_patches" >> $GITHUB_ENV

          git clone --depth=1 https://github.com/kerneltoast/android_kernel_google_zuma sultan
          echo "kernel_dir=$PWD/sultan" >> $GITHUB_ENV

          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU_patch.git suki_patches
          echo "suki_dir=$PWD/suki_patches" >> $GITHUB_ENV

          DATE=$(date +"%Y.%m.%d")
          ZIP_NAME="${DATE}-${CODENAME}_A16_Sultan-SukiSU-${GITHUB_RUN_NUMBER}"
          echo "zip_name=$ZIP_NAME" >> $GITHUB_ENV
          echo "defconfig=$DEFCONFIG" >> $GITHUB_ENV
          echo "codename=$CODENAME" >> $GITHUB_ENV

      - name: Setup kernel config and apply SukiSU hooks
        run: |
          cd "${{ env.kernel_dir }}"
          DEFCONFIG_PATH="arch/arm64/configs/${{ env.defconfig }}"

          patch -p1 -F 3 < "${{ env.suki_dir }}/hooks/scope_min_manual_hooks_v1.6.patch"

          CONFIGS="CONFIG_TMPFS_XATTR=y CONFIG_TMPFS_POSIX_ACL=y \
          CONFIG_IP_NF_TARGET_TTL=y CONFIG_IP6_NF_TARGET_HL=y CONFIG_IP6_NF_MATCH_HL=y \
          CONFIG_TCP_CONG_ADVANCED=y CONFIG_TCP_CONG_BBR=y CONFIG_NET_SCH_FQ=y \
          CONFIG_TCP_CONG_BIC=n CONFIG_TCP_CONG_WESTWOOD=n CONFIG_TCP_CONG_HTCP=n \
          CONFIG_DEFAULT_BBR=y CONFIG_BPF_STREAM_PARSER=y \
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y CONFIG_NETFILTER_XT_SET=y CONFIG_IP_SET=y \
          CONFIG_IP_SET_MAX=65534 CONFIG_IP_SET_BITMAP_IP=y CONFIG_IP_SET_BITMAP_IPMAC=y \
          CONFIG_IP_SET_BITMAP_PORT=y CONFIG_IP_SET_HASH_IP=y CONFIG_IP_SET_HASH_IPMARK=y \
          CONFIG_IP_SET_HASH_IPPORT=y CONFIG_IP_SET_HASH_IPPORTIP=y CONFIG_IP_SET_HASH_IPPORTNET=y \
          CONFIG_IP_SET_HASH_IPMAC=y CONFIG_IP_SET_HASH_MAC=y CONFIG_IP_SET_HASH_NETPORTNET=y \
          CONFIG_IP_SET_HASH_NET=y CONFIG_IP_SET_HASH_NETNET=y CONFIG_IP_SET_HASH_NETPORT=y \
          CONFIG_IP_SET_HASH_NETIFACE=y CONFIG_IP_SET_LIST_SET=y \
          CONFIG_IP6_NF_NAT=y CONFIG_IP6_NF_TARGET_MASQUERADE=y \
          CONFIG_KSU_MANUAL_HOOK=y CONFIG_KSU_MANUAL_SU=n CONFIG_COMPAT=y CONFIG_ZRAM_GS_WRITEBACK=y"

          for CONFIG in $CONFIGS; do
            NAME=$(echo "$CONFIG" | cut -d '=' -f1)
            sed -i -E "s/.*(${NAME}=.*)/# \1/" "$DEFCONFIG_PATH" || true
            echo "$CONFIG" >> "$DEFCONFIG_PATH"
          done

      - name: Add Baseband-guard
        run: |
          cd "${{ env.kernel_dir }}"
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> "arch/arm64/configs/${{ env.defconfig }}"
          sed -i '/^config LSM$/,/^help$/{/default/ s/lockdown/lockdown,baseband_guard/}' security/Kconfig

      - name: Add SukiSU
        run: |
          cd "${{ env.kernel_dir }}"
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/susfs-main/kernel/setup.sh" | bash -s susfs-main
          echo "CONFIG_KSU=y" >> "arch/arm64/configs/${{ env.defconfig }}"
          echo "CONFIG_KSU_KPROBES_HOOK=n" >> "arch/arm64/configs/${{ env.defconfig }}"

      - name: Apply SUSFS patches and sys.c_fix
        run: |
          cp "${{ env.susfs_dir }}/kernel_patches/fs/"* "${{ env.kernel_dir }}/fs/" || true
          cp "${{ env.susfs_dir }}/kernel_patches/include/linux/"* "${{ env.kernel_dir }}/include/linux/" || true

          cd "${{ env.kernel_dir }}"
          patch -p1 --fuzz=3 < "${{ env.james_dir }}/sultan/sys.c_fix.patch"

          echo "CONFIG_KSU_SUSFS=n" >> "arch/arm64/configs/${{ env.defconfig }}"

      - name: Cache kernel build
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: zuma-SukiSU-${{ github.sha }}
          restore-keys: |
            zuma-SukiSU-
            zuma-

      - name: Build the kernel
        run: |
          cd "${{ env.kernel_dir }}"
          TOOLCHAIN="$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux-"

          make CROSS_COMPILE="${TOOLCHAIN}" CC="${TOOLCHAIN}gcc" -j$(nproc) "${{ env.defconfig }}"
          make CROSS_COMPILE="ccache ${TOOLCHAIN}" CC="ccache ${TOOLCHAIN}gcc" -j$(nproc)

      - name: Prepare AnyKernel3
        run: |
          cd "${{ env.kernel_dir }}"
          cp out/arch/arm64/boot/Image.lz4 "${{ env.ak3_dir }}/Image.lz4"
          cat out/google-devices/${{ env.codename }}/dts/*.dtb > "${{ env.ak3_dir }}/dtb"

      - name: Create flashable zip
        run: |
          cd AK3
          zip -r "../${{ env.zip_name }}.zip" ./*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.zip_name }}
          path: "*.zip"

  release:
    needs: sukisu-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate kernel changelog
        run: |
          git clone --depth=50 https://github.com/kerneltoast/android_kernel_google_zuma sultan_kernel
          cd sultan_kernel
          git log -n 20 --pretty=format:"- %h %s (%cr)" > ../kernel_changelog.txt
          cd ..

      - name: Generate release notes
        run: |
          DATE=$(date +"%d/%m/%Y")
          echo "DATE=$DATE" >> $GITHUB_ENV

          echo "Compatibility Notice" > release_body.txt
          echo "" >> release_body.txt
          echo "Verify compatibility with Sultan kernel upstream:" >> release_body.txt
          echo "https://github.com/kerneltoast/android_kernel_google_zuma" >> release_body.txt
          echo "" >> release_body.txt
          echo "Features:" >> release_body.txt
          echo "- SukiSU Ultra integration" >> release_body.txt
          echo "- SUSFS integration" >> release_body.txt
          echo "- Baseband-guard enabled" >> release_body.txt
          echo "" >> release_body.txt

          echo "Kernel changelog:" >> release_body.txt
          cat kernel_changelog.txt >> release_body.txt

          if [ -f device_notes.md ]; then
            echo "" >> release_body.txt
            echo "Device notes:" >> release_body.txt
            cat device_notes.md >> release_body.txt
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "sukisu-${{ github.run_number }}"
          name: "SukiSU Kernel Build #${{ github.run_number }} - ${{ env.DATE }}"
          body_path: release_body.txt
          files: ./artifacts/**/*.zip
